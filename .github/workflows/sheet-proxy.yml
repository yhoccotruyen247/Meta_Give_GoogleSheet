name: Sheet Proxy - Follow Redirect
on:
  repository_dispatch:
    types: [ping, get_todo, lock, update_caption, update_prompt, update_clip, done, list]

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Call Apps Script with curl -L (follow 302 redirect)
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          echo "=== Action: ${{ github.event.action }} ==="
          echo "Payload: ${{ toJson(github.event.client_payload) }}"
          
          ACTION="${{ github.event.action }}"
          STT="${{ github.event.client_payload.stt }}"
          UID="${{ github.event.client_payload.uid }}"
          CLIP="${{ github.event.client_payload.clip }}"
          LINK="${{ github.event.client_payload.link }}"
          CAPTION="${{ github.event.client_payload.caption }}"
          PROMPT="${{ github.event.client_payload.prompt }}"
          LINK_TONG="${{ github.event.client_payload.linkTong }}"
          LINK_DRIVE="${{ github.event.client_payload.linkDrive }}"
          STATUS="${{ github.event.client_payload.status }}"
          
          # Build URL - curl -L will follow 302 redirect from script.google.com -> script.googleusercontent.com
          URL="$APPS_SCRIPT_URL?action=$ACTION"
          if [ -n "$STT" ]; then URL="$URL&stt=$STT"; fi
          if [ -n "$UID" ]; then URL="$URL&uid=$UID"; fi
          if [ -n "$CLIP" ]; then URL="$URL&clip=$CLIP"; fi
          if [ -n "$LINK" ]; then URL="$URL&link=$(echo $LINK | jq -sRr @uri)"; fi
          if [ -n "$CAPTION" ]; then URL="$URL&caption=$(echo $CAPTION | jq -sRr @uri)"; fi
          if [ -n "$PROMPT" ]; then URL="$URL&prompt=$(echo $PROMPT | jq -sRr @uri)"; fi
          if [ -n "$LINK_TONG" ]; then URL="$URL&linkTong=$(echo $LINK_TONG | jq -sRr @uri)"; fi
          if [ -n "$LINK_DRIVE" ]; then URL="$URL&linkDrive=$(echo $LINK_DRIVE | jq -sRr @uri)"; fi
          if [ -n "$STATUS" ]; then URL="$URL&status=$(echo $STATUS | jq -sRr @uri)"; fi
          
          echo "Calling (masked): $APPS_SCRIPT_URL?action=$ACTION&stt=$STT&uid=$UID"
          
          # -L follow redirect, -s silent, -i include headers for debug
          HTTP_CODE=$(curl -L -s -o response.json -w "%{http_code}" "$URL")
          echo "HTTP CODE: $HTTP_CODE"
          echo "Final response:"
          cat response.json
          
          # Check if success
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Proxy success"
          else
            echo "❌ Proxy failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Show sheet status after lock (optional)
        if: github.event.action == 'lock'
        run: |
          echo "Checked H column should now be Đang làm for STT ${{ github.event.client_payload.stt }}"
