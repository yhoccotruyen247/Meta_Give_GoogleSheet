<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopee Video Factory – GitHub Data</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#dce2ea;--text:#172033;--muted:#667085;--orange:#ee4d2d;--blue:#2563eb;--shadow:0 10px 30px #1f293714}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Segoe UI,Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.bar{display:flex;gap:9px;align-items:center;padding:11px 16px;flex-wrap:wrap}.brand{margin-right:auto}.brand b{font-size:17px}.brand small{display:block;color:var(--muted)}button,.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 12px;border-radius:9px;font-weight:650;cursor:pointer;text-decoration:none}.primary{background:var(--orange);border-color:var(--orange);color:#fff}.dark{background:#24292f;border-color:#24292f;color:#fff}main{padding:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;box-shadow:var(--shadow)}.stat span{color:var(--muted)}.stat strong{display:block;font-size:21px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.tools input,.tools select,.field input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px}.tools input{min-width:250px}.right{margin-left:auto;color:var(--muted)}.sheet{height:calc(100vh - 215px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}table{border-collapse:separate;border-spacing:0;min-width:2500px;width:100%}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;vertical-align:top}th{position:sticky;top:0;z-index:5;background:#eff2f6;text-align:left;font-size:12px}th:first-child,td:first-child{position:sticky;left:0;z-index:4;background:#fafafa;text-align:center;width:43px}th:first-child{z-index:7}td[contenteditable]{white-space:pre-wrap;overflow-wrap:anywhere;outline:0}td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--blue);background:#eff6ff}.status{font-weight:700;text-align:center}.wait{background:#fff6cf}.work{background:#e8f1ff;color:#175cd3}.done{background:#dcfce7;color:#087a43}.error{background:#fee2e2;color:#b42318}dialog{border:0;border-radius:15px;width:min(570px,calc(100% - 28px));padding:0;box-shadow:0 30px 90px #0004}dialog::backdrop{background:#0f172a88}.modal{padding:20px}.modal h2{margin:0}.modal p{color:var(--muted)}.field{display:grid;gap:5px;margin-top:12px}.hint{padding:10px;border-radius:8px;background:#fff8e8;border:1px solid #f3d58a}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{display:none;position:fixed;right:18px;bottom:18px;z-index:50;max-width:430px;padding:12px 15px;background:#172033;color:#fff;border-radius:10px}.toast.show{display:block}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.sheet{height:calc(100vh - 285px)}.brand{width:100%}.right{width:100%;margin:0}}
</style></head><body>
<header><div class="bar"><div class="brand"><b>Shopee Video Factory V7</b><small>GitHub là dữ liệu chính · Google Sheet là bản đồng bộ</small></div>
<button id="readGithub">↻ Đọc GitHub</button><button id="sheetUp">Sheet → GitHub</button><button id="sheetDown">GitHub → Sheet</button><button id="save" class="dark">Lưu sửa đổi</button></div></header>
<main><section class="stats"><div class="stat"><span>Tổng dòng</span><strong id="total">0</strong></div><div class="stat"><span>Chờ</span><strong id="waiting">0</strong></div><div class="stat"><span>Đang làm</span><strong id="working">0</strong></div><div class="stat"><span>Done</span><strong id="done">0</strong></div></section>
<div class="tools"><input id="search" placeholder="Tìm tên, STT, link, tài khoản…"><select id="filter"><option value="">Tất cả trạng thái</option><option>Chờ</option><option>Đang làm</option><option>Done</option><option>Lỗi</option></select><button id="add">+ Thêm dòng</button><button id="copy">Copy sang Sheet</button><button id="download" class="primary">Tải CSV</button><span class="right" id="source">Chưa kết nối</span></div>
<div class="sheet"><table><thead><tr id="head"><th>#</th></tr></thead><tbody id="body"></tbody></table></div></main>
<div class="toast" id="toast"></div>
<script>
const WEBHOOK_URL='https://script.google.com/macros/s/AKfycbx6e0czxEhmvrnH0dLXZXMh1ycPwX5U6fInzrZifj8T7CC1bZUoRG2tTqwCATGd4jEf/exec';
const HEADERS=['STT','Tên Sản phẩm','Ảnh Sản phẩm','Caption Shopee Video (tối đa 150 kí tự gồm 5 hashtag)','Prompt Video Tổng','Link Affiliate Shopee','Link Google Drive','Status','KOL','Folder G.Drive','Tài khoản Facebook','Link Video Tổng','Link Video 1','Link Video 2','Link Video 3'];
const widths=[65,260,210,300,420,200,200,110,190,190,160,190,190,190,190],$=s=>document.querySelector(s);let rows=[];
function notice(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),4000)}
async function api(action,data={}){const p=new URLSearchParams({action,...data});const res=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:p.toString()});const out=await res.json();if(!out.success)throw Error(out.message||'Webhook báo lỗi');return out}
function initHead(){HEADERS.forEach((h,i)=>{const th=document.createElement('th');th.textContent=String.fromCharCode(65+i)+' · '+h;th.style.minWidth=widths[i]+'px';$('#head').append(th)})}
function statusClass(td,v){td.classList.remove('wait','work','done','error');const x=(v||'').toLowerCase();if(!x||x==='chờ')td.classList.add('wait');else if(x==='đang làm')td.classList.add('work');else if(x==='done')td.classList.add('done');else if(x==='lỗi')td.classList.add('error')}
function render(){const q=$('#search').value.toLowerCase(),f=$('#filter').value;$('#body').innerHTML='';rows.forEach((r,ri)=>{if((q&&!r.join(' ').toLowerCase().includes(q))||(f&&r[7]!==f))return;const tr=document.createElement('tr'),n=document.createElement('td');n.textContent=ri+2;tr.append(n);HEADERS.forEach((_,ci)=>{const td=document.createElement('td');td.contentEditable='true';td.dataset.r=ri;td.dataset.c=ci;td.textContent=r[ci]||'';if(ci===7){td.classList.add('status');statusClass(td,r[ci])}td.oninput=edit;tr.append(td)});$('#body').append(tr)});stats()}
function edit(e){const r=+e.target.dataset.r,c=+e.target.dataset.c;rows[r][c]=e.target.innerText.trim();if(c===7)statusClass(e.target,rows[r][c]);localStorage.setItem('githubDraft',JSON.stringify(rows));$('#source').textContent='Có sửa đổi chưa lưu';stats()}
function stats(){const s={};rows.forEach(r=>s[r[7]||'Chờ']=(s[r[7]||'Chờ']||0)+1);$('#total').textContent=rows.length;$('#waiting').textContent=s['Chờ']||0;$('#working').textContent=s['Đang làm']||0;$('#done').textContent=s.Done||0}
async function readGithub(){try{$('#source').textContent='Đang đọc GitHub…';const out=await api('list');rows=(out.rows||[]).map(r=>HEADERS.map((_,i)=>String(r[i]??'')));localStorage.setItem('githubDraft',JSON.stringify(rows));render();$('#source').textContent='GitHub · '+new Date().toLocaleTimeString('vi-VN');notice('Đã đọc dữ liệu mới nhất từ GitHub')}catch(e){notice(e.message);const d=localStorage.getItem('githubDraft');if(d){rows=JSON.parse(d);render();$('#source').textContent='Bản nháp trên máy'}}}
async function writeAction(action,data={}){try{$('#source').textContent='Đang xử lý…';const out=await api(action,data);notice(out.message||'Thành công');await readGithub()}catch(e){notice(e.message);$('#source').textContent='Thao tác thất bại'}}
const csvEsc=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=()=>[HEADERS,...rows].map(r=>r.map(csvEsc).join(',')).join('\r\n');
function download(){const b=new Blob(['\ufeff'+csv()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ShopeeMain-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)}
initHead();const draft=localStorage.getItem('githubDraft');if(draft){try{rows=JSON.parse(draft);render();$('#source').textContent='Bản nháp trên máy'}catch{}}
$('#readGithub').onclick=readGithub;$('#sheetUp').onclick=()=>confirm('Ghi toàn bộ Sheet đè lên dữ liệu GitHub?')&&writeAction('sync_sheet_to_github');$('#sheetDown').onclick=()=>confirm('Ghi toàn bộ dữ liệu GitHub đè lên Google Sheet?')&&writeAction('sync_github_to_sheet');$('#save').onclick=()=>writeAction('replace_all',{rowsJson:JSON.stringify(rows),uid:'github-pages'});$('#search').oninput=render;$('#filter').onchange=render;
$('#add').onclick=()=>{rows.push(HEADERS.map((_,i)=>i===0?String(rows.length+1):i===7?'Chờ':''));render();localStorage.setItem('githubDraft',JSON.stringify(rows))};$('#download').onclick=download;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText([HEADERS,...rows].map(r=>r.join('\t')).join('\n'));notice('Đã copy; chọn A1 trong Sheet rồi Ctrl+V')}catch{notice('Clipboard bị chặn; hãy tải CSV')}};
readGithub();
</script></body></html>
